name: Daily Watchlist Update (09:00 Taipei)

on:
  schedule:
    # UTC 01:00 = 台北時間每天早上 09:00
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest market & macro data (build.py)
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          python3 build/build.py --no-publish

      - name: Inject fresh payload into redesigned index.html
        run: |
          python3 build/inject_redesign.py \
            --source build/index.html \
            --template build/templates/redesign_template.html \
            --output index.html

      - name: Commit updated site (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: daily watchlist update ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
